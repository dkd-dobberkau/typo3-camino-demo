name: Build and Push TYPO3 Camino Demo

on:
  push:
    branches: [main]
  pull_request:
    # Nur bauen, nicht pushen — validiert Dockerfile- und Dependency-Änderungen,
    # bevor sie auf main landen und :latest überschreiben.
  schedule:
    # Jeden Sonntag um 3 Uhr UTC neu bauen
    - cron: '0 3 * * 0'
  workflow_dispatch:
    # Manueller Trigger möglich

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Bleibt statisch — der permissions-Block wertet keine Expressions aus.
      # Auf Pull Requests wird ohnehin nicht gepusht (siehe push: unten), und
      # bei Forks ist der GITHUB_TOKEN grundsätzlich nur lesend.
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=14
            type=sha,prefix=
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Auf Pull Requests nur amd64: der Build validiert das Dockerfile und
          # die Abhängigkeiten, und die arm64-Emulation verdoppelt die Laufzeit,
          # ohne dass ein Artefakt entsteht.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
